[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "tethysdash_plugin_hydroserver"
authors = [{ name = "Aquaveo LLC", email = "jdolinar@aquaveo.com" }]
license = { file = "LICENSE" }
readme = "README.md"
classifiers = ["License :: OSI Approved :: MIT License"]
version = "0.0.1"
description = "HydroServer plugin for tethysdash"
requires-python = ">=3.12"
dependencies = [
    "intake>=2.0.0",
    "hydroserverpy>=1.12",
    "pandas"
]

[project.urls]
Homepage = "https://github.com/Aquaveo/tethysdash-plugin-hydroserver"
Issues = "https://github.com/Aquaveo/tethysdash-plugin-hydroserver/issues"

[project.entry-points."intake.drivers"]
hydroserver_datastream_plot = "tethysdash_plugin_hydroserver.datastream_plot:HydroServerDatastreamPlot"
hydroserver_sites_map = "tethysdash_plugin_hydroserver.sites_map:HydroServerSitesMap"
hydroserver_sites_map_layer = "tethysdash_plugin_hydroserver.sites_map_layer:HydroServerSitesMapLayer"
hydroserver_datastream_dropdown = "tethysdash_plugin_hydroserver.datastream_dropdown:HydroServerDatastreamDropdown"
hydroserver_sites_dropdown = "tethysdash_plugin_hydroserver.sites_dropdown:HydroServerSitesDropdown"

[tool.setuptools]
include-package-data = true
zip-safe = false

[tool.setuptools.packages.find]
include = ["tethysdash_plugin_hydroserver*"]
